name: Build and browser smoke checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production bundle
        run: pnpm build
      - name: Smoke-check production entrypoint
        run: test -s dist/index.html && test -n "$(find dist/assets -maxdepth 1 -type f -print -quit)" && grep -q '/assets/' dist/index.html
      - name: Install isolated Playwright runner
        run: npm install --prefix /tmp/alpha-browser-test --no-save --no-package-lock playwright@1.55.0
      - name: Install Chromium
        run: /tmp/alpha-browser-test/node_modules/.bin/playwright install --with-deps chromium
      - name: Start production preview
        run: |
          pnpm preview --host 127.0.0.1 --port 4173 > /tmp/alpha-preview.log 2>&1 &
          echo $! > /tmp/alpha-preview.pid
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/alpha-preview.log
          exit 1
      - name: Run real-browser smoke tests
        env:
          PLAYWRIGHT_MODULE: /tmp/alpha-browser-test/node_modules/playwright/index.mjs
          ALPHA_BASE_URL: http://127.0.0.1:4173
        run: node tests/browser-smoke.mjs
      - name: Print preview logs on failure
        if: failure()
        run: cat /tmp/alpha-preview.log || true
